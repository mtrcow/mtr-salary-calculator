<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTR 2026 薪酬預測系統 - 專業版</title>
    <style>
        /* --- 核心主題變數 (動態切換) --- */
        :root {
            /* 預設：曜石黑金 (Obsidian) */
            --bg-base: #0A0A0C;
            --bg-card: #141417;
            --text-main: #E0E0E0;
            --text-muted: #8E8E93;
            --accent-gold: #D4AF37;
            --accent-gold-dim: rgba(212, 175, 55, 0.15);
            --border-color: #2C2C2E;
            --btn-grad: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            --btn-text: #000;
            --table-th-bg: #1A1A1D;
            --table-super-bg: #111113;
            --april-color: #5BC0BE; /* 4月大糧專屬亮藍綠色 */
            --april-bg: rgba(91, 192, 190, 0.1);
        }

        /* 主題 1：蒼玄 (Sougen - Navy & Ice) */
        [data-theme="sougen"] {
            --bg-base: #0B111A;
            --bg-card: #121A25;
            --text-main: #E8ECEF;
            --text-muted: #8C9BAB;
            --accent-gold: #82A0C2;
            --accent-gold-dim: rgba(130, 160, 194, 0.15);
            --border-color: #233040;
            --btn-grad: linear-gradient(135deg, #82A0C2 0%, #5B7A9E 100%);
            --btn-text: #FFF;
            --table-th-bg: #182333;
            --table-super-bg: #0E1622;
            --april-color: #F2C94C;
            --april-bg: rgba(242, 201, 76, 0.1);
        }

        /* 主題 2：利休 (Rikyu - Mocha & Sand) */
        [data-theme="rikyu"] {
            --bg-base: #141311;
            --bg-card: #1E1C19;
            --text-main: #EAE5DE;
            --text-muted: #9E988F;
            --accent-gold: #C4A77D;
            --accent-gold-dim: rgba(196, 167, 125, 0.15);
            --border-color: #33302A;
            --btn-grad: linear-gradient(135deg, #C4A77D 0%, #9E825A 100%);
            --btn-text: #141311;
            --table-th-bg: #26231E;
            --table-super-bg: #1A1815;
            --april-color: #A3B18A;
            --april-bg: rgba(163, 177, 138, 0.1);
        }

        /* 主題 3：撫子 (Nadeshiko - Plum & Rose Gold) */
        [data-theme="nadeshiko"] {
            --bg-base: #171214;
            --bg-card: #21191D;
            --text-main: #F0EBEF;
            --text-muted: #9E8D96;
            --accent-gold: #DDA7B0;
            --accent-gold-dim: rgba(221, 167, 176, 0.15);
            --border-color: #3B2D33;
            --btn-grad: linear-gradient(135deg, #DDA7B0 0%, #B8808A 100%);
            --btn-text: #171214;
            --table-th-bg: #2B1F25;
            --table-super-bg: #1E161A;
            --april-color: #E29578;
            --april-bg: rgba(226, 149, 120, 0.1);
        }

        /* --- 基礎排版 CSS --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px 40px 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .theme-select {
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            appearance: none;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            color: var(--accent-gold);
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            transition: color 0.4s ease;
        }
        .header p { color: var(--text-muted); font-size: 0.85rem; margin: 0; letter-spacing: 2px; }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .section-title {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .section-title::before {
            content: ''; display: inline-block; width: 4px; height: 16px;
            background-color: var(--accent-gold); margin-right: 10px; border-radius: 2px;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }

        select:not(.theme-select), input {
            width: 100%; background-color: var(--bg-base); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 10px; padding: 14px 16px;
            font-size: 1rem; box-sizing: border-box; appearance: none; transition: all 0.3s ease;
        }
        select:not(.theme-select):focus, input:focus {
            outline: none; border-color: var(--accent-gold); box-shadow: 0 0 0 2px var(--accent-gold-dim);
        }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▼'; font-size: 0.8rem; color: var(--accent-gold);
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;
        }

        .btn-calc {
            width: 100%; background: var(--btn-grad); color: var(--btn-text);
            border: none; padding: 16px; border-radius: 10px; font-size: 1.1rem;
            font-weight: 600; letter-spacing: 1px; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); transition: all 0.3s;
        }
        .btn-calc:active { transform: scale(0.98); }

        .result-box {
            display: none; margin-top: 25px; padding-top: 20px; border-top: 1px dashed var(--border-color);
        }

        .result-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border-color);
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { font-size: 0.9rem; color: var(--text-muted); }
        .result-value { font-size: 1.1rem; color: var(--text-main); font-weight: 500; }

        .highlight-row {
            background-color: var(--accent-gold-dim); padding: 15px; border-radius: 8px;
            margin-top: 15px; border: 1px solid var(--accent-gold); transition: all 0.4s;
        }
        .highlight-row .result-label { color: var(--accent-gold); font-weight: bold; }
        .highlight-row .result-value { font-size: 1.3rem; color: var(--accent-gold); font-weight: bold; }

        /* 4月大糧特別高亮 */
        .april-row {
            background-color: var(--april-bg); padding: 18px 15px; border-radius: 8px;
            margin-top: 10px; border: 1px dashed var(--april-color); transition: all 0.4s;
        }
        .april-row .result-label { color: var(--april-color); font-weight: bold; }
        .april-row .result-value { font-size: 1.5rem; color: var(--april-color); font-weight: bold; }

        .table-wrapper {
            width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
            border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-base);
        }
        table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 0.85rem; }
        th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        th { background-color: var(--table-th-bg); color: var(--accent-gold); font-weight: 500; position: sticky; top: 0; }
        
        .col-grade {
            position: sticky; left: 0; background-color: var(--table-th-bg); text-align: left;
            font-weight: bold; color: var(--text-main); border-right: 1px solid var(--border-color); z-index: 2;
        }
        tr:last-child td { border-bottom: none; }
        .super-header { text-align: center; border-bottom: 1px solid var(--accent-gold); background-color: var(--table-super-bg); }
        .sys-msg { color: #FF6B6B; font-size: 0.8rem; margin-top: 10px; text-align: right; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="select-wrapper" style="width: auto;">
            <select class="theme-select" onchange="document.body.setAttribute('data-theme', this.value)">
                <option value="" style="color:#000;">黑金 (Obsidian)</option>
                <option value="sougen" style="color:#000;">蒼玄 (Navy & Ice)</option>
                <option value="rikyu" style="color:#000;">利休 (Mocha & Sand)</option>
                <option value="nadeshiko" style="color:#000;">撫子 (Plum & Rose)</option>
            </select>
        </div>
    </div>

    <div class="header">
        <h1>MTR SALARY</h1>
        <p>2026 EXECUTIVE FORECAST</p>
    </div>

    <div class="card">
        <div class="section-title">MTR 薪酬預測計算</div>
        
        <div class="form-group">
            <label>職級 (Grade)</label>
            <div class="select-wrapper">
                <select id="calcGrade"></select>
            </div>
        </div>

        <div class="form-group">
            <label>現時底薪 (Current Paid)</label>
            <input type="number" id="calcCurrentPaid" placeholder="請輸入金額 (例如: 25000)">
        </div>

        <div class="form-group" style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>評分 (Rating)</label>
                <div class="select-wrapper">
                    <select id="calcRating">
                        <option value="5">5 (極佳)</option>
                        <option value="4">4 (良好)</option>
                        <option value="3" selected>3 (標準)</option>
                        <option value="2">2 (需改進)</option>
                        <option value="1">1 (不合格)</option>
                    </select>
                </div>
            </div>
            <div style="flex: 1;">
                <label>房屋津貼</label>
                <input type="number" id="calcHousing" value="0">
            </div>
        </div>

        <button class="btn-calc" onclick="runCalculation()">立即計算</button>

        <div class="result-box" id="resultBox">
            <div class="result-row">
                <span class="result-label">底薪加幅</span>
                <span class="result-value" id="resInc">$0</span>
            </div>
            <div class="result-row">
                <span class="result-label">2026 新底薪</span>
                <span class="result-value" id="resNewPaid">$0</span>
            </div>
            <div class="result-row">
                <span class="result-label">年度獎金 (DA+PA+SA)</span>
                <span class="result-value" id="resBonus">$0</span>
            </div>
            <div id="sysMsg" class="sys-msg"></div>

            <div class="result-row april-row">
                <span class="result-label">4月發放總額 🤩<br><small style="font-size:0.75rem; opacity:0.8; font-weight:normal;">(4月新底薪 + 年度獎金)</small></span>
                <span class="result-value" id="resAprilTotal">$0</span>
            </div>

            <div class="result-row highlight-row">
                <span class="result-label">平時每月實收<br><small style="font-size:0.7rem; opacity:0.7; font-weight:normal;">(已扣 5% MPF 上限 $1500 + 津貼)</small></span>
                <span class="result-value" id="resTotalMonth">$0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">MTR 全職級薪酬矩陣</div>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: -10px; margin-bottom: 15px;">左右滑動查看完整數據 <span style="font-size:1rem;">👉</span></p>
        
        <div class="table-wrapper">
            <table id="salaryTable">
                <thead>
                    <tr>
                        <th rowspan="2" class="col-grade">Grade</th>
                        <th colspan="4" class="super-header">Before 4/2026</th>
                        <th colspan="4" class="super-header">After 4/2026</th>
                    </tr>
                    <tr>
                        <th>Min</th>
                        <th>Q1 (25%)</th>
                        <th>Mid (50%)</th>
                        <th>Max</th>
                        <th style="color:var(--text-main);">Min</th>
                        <th style="color:var(--text-main);">Q1 (25%)</th>
                        <th style="color:var(--text-main);">Mid (50%)</th>
                        <th style="color:var(--text-main);">Max</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

<script>
    const rawData = [
        { grade: "S40", bMin: 30450, bQ1: 38170, bMid: 45880, bMax: 61310, aMin: 31060, aQ1: 38930, aMid: 46800, aMax: 62540 },
        { grade: "S31", bMin: 28010, bQ1: 35700, bMid: 43375, bMax: 58740, aMin: 28580, aQ1: 36420, aMid: 44250, aMax: 59920 },
        { grade: "S30", bMin: 28300, bQ1: 34460, bMid: 40620, bMax: 52940, aMin: 28870, aQ1: 35160, aMid: 41435, aMax: 54000 },
        { grade: "S21", bMin: 21710, bQ1: 26440, bMid: 31155, bMax: 40600, aMin: 22150, aQ1: 26970, aMid: 31785, aMax: 41420 },
        { grade: "S20", bMin: 24840, bQ1: 28780, bMid: 32720, bMax: 40600, aMin: 25340, aQ1: 29360, aMid: 33380, aMax: 41420 },
        { grade: "S11", bMin: 17480, bQ1: 21050, bMid: 24605, bMax: 31730, aMin: 17830, aQ1: 21470, aMid: 25100, aMax: 32370 },
        { grade: "S10", bMin: 19280, bQ1: 22730, bMid: 26180, bMax: 33080, aMin: 19670, aQ1: 23190, aMid: 26710, aMax: 33750 },
        { grade: "G51", bMin: 15690, bQ1: 19700, bMid: 23710, bMax: 31730, aMin: 16010, aQ1: 20100, aMid: 24190, aMax: 32370 },
        { grade: "G50", bMin: 17200, bQ1: 19910, bMid: 22610, bMax: 28020, aMin: 17550, aQ1: 20310, aMid: 23070, aMax: 28590 },
        { grade: "G41", bMin: 12810, bQ1: 14830, bMid: 16835, bMax: 20860, aMin: 13070, aQ1: 15130, aMid: 17175, aMax: 21280 },
        { grade: "G42", bMin: 12810, bQ1: 15390, bMid: 17970, bMax: 23130, aMin: 13070, aQ1: 15710, aMid: 18335, aMax: 23600 },
        { grade: "G43", bMin: 12810, bQ1: 16010, bMid: 19205, bMax: 25600, aMin: 13070, aQ1: 16340, aMid: 19595, aMax: 26120 },
        { grade: "G40", bMin: 15690, bQ1: 18170, bMid: 20645, bMax: 25600, aMin: 16010, aQ1: 18540, aMid: 21065, aMax: 26120 },
        { grade: "G31", bMin: 13830, bQ1: 16160, bMid: 18480, bMax: 23130, aMin: 14110, aQ1: 16490, aMid: 18855, aMax: 23600 },
        { grade: "G30", bMin: 12810, bQ1: 14740, bMid: 16665, bMax: 20520, aMin: 13070, aQ1: 15040, aMid: 17005, aMax: 20940 },
        { grade: "G20", bMin: 9390, bQ1: 10870, bMid: 12335, bMax: 15280, aMin: 9580, aQ1: 11090, aMid: 12585, aMax: 15590 },
        { grade: "G10", bMin: 8310, bQ1: 9010, bMid: 9705, bMax: 11100, aMin: 8480, aQ1: 9200, aMid: 9905, aMax: 11330 }
    ];

    const ratingVariables = {
        "1": { inc: 0, da: 0, pa: 0, sa: 0.1 },
        "2": { inc: 0.016, da: 0, pa: 0, sa: 0.1 },
        "3": { inc: 0.032, da: 1.3, pa: 0, sa: 0.1 },
        "4": { inc: 0.0384, da: 1.3, pa: 0.33, sa: 0.1 },
        "5": { inc: 0.048, da: 1.3, pa: 0.67, sa: 0.1 }
    };

    function formatMoney(num) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    window.onload = function() {
        const tableBody = document.querySelector("#salaryTable tbody");
        const gradeSelect = document.querySelector("#calcGrade");

        rawData.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-grade">${row.grade}</td>
                <td>${formatMoney(row.bMin)}</td>
                <td>${formatMoney(row.bQ1)}</td>
                <td>${formatMoney(row.bMid)}</td>
                <td>${formatMoney(row.bMax)}</td>
                <td style="color:var(--text-main);">${formatMoney(row.aMin)}</td>
                <td style="color:var(--text-main);">${formatMoney(row.aQ1)}</td>
                <td style="color:var(--text-main);">${formatMoney(row.aMid)}</td>
                <td style="color:var(--text-main);">${formatMoney(row.aMax)}</td>
            `;
            tableBody.appendChild(tr);

            const option = document.createElement('option');
            option.value = row.grade;
            option.text = row.grade;
            gradeSelect.appendChild(option);
        });
    };

    function runCalculation() {
        const gradeInput = document.getElementById("calcGrade").value;
        const currentPaidInput = parseFloat(document.getElementById("calcCurrentPaid").value);
        const ratingInput = document.getElementById("calcRating").value;
        const housingInput = parseFloat(document.getElementById("calcHousing").value) || 0;

        if (isNaN(currentPaidInput) || currentPaidInput <= 0) {
            alert("請輸入有效的現時底薪！");
            return;
        }

        const gradeData = rawData.find(item => item.grade === gradeInput);
        const ratData = ratingVariables[ratingInput];
        let sysMsg = "";

        if (!gradeData) return;

        let increment = currentPaidInput * ratData.inc;
        let newPaid = currentPaidInput + increment;

        if (newPaid > gradeData.aMax) {
            newPaid = gradeData.aMax;
            increment = newPaid - currentPaidInput;
            if (increment < 0) increment = 0;
            sysMsg = `⚠️ 已達該職級頂薪點 (Max Pay: $${formatMoney(gradeData.aMax)})`;
        }

        let totalBonusMonths = ratData.da + ratData.pa + ratData.sa;
        let bonusAmount = currentPaidInput * totalBonusMonths;

        // 計算4月大糧 (新底薪 + 年度總獎金)
        let aprilTotalPayout = newPaid + bonusAmount;

        let mpf = newPaid * 0.05;
        if (mpf > 1500) mpf = 1500;

        let monthlyTakeHome = newPaid - mpf + housingInput;

        document.getElementById("resNewPaid").innerText = "$" + formatMoney(newPaid);
        document.getElementById("resInc").innerText = "$" + formatMoney(increment);
        document.getElementById("resBonus").innerText = "$" + formatMoney(bonusAmount) + ` (${totalBonusMonths.toFixed(2)}m)`;
        
        // 更新 UI 顯示
        document.getElementById("resAprilTotal").innerText = "$" + formatMoney(aprilTotalPayout);
        document.getElementById("resTotalMonth").innerText = "$" + formatMoney(monthlyTakeHome);
        document.getElementById("sysMsg").innerText = sysMsg;

        const resultBox = document.getElementById("resultBox");
        resultBox.style.display = "block";
        resultBox.style.animation = "fadeIn 0.5s ease";
    }
</script>
</body>
</html>
